<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View ordering with arbitrary center echoes</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="spinner" class="spinner hidden"></div>
    
    <div class="container">
        <h1>View ordering with arbitrary center echoes</h1>
        
        <div class="control-panel">
            <h3>Acquisition parameters</h3>
            <div class="control-group">
                <label for="ky-slider">k<sub>y</sub> Matrix Size: <span id="ky-value">128</span></label>
                    <input type="range" id="ky-slider" min="64" max="320" value="128" step="32" class="slider" list="ky-ticks">
            </div>
                <datalist id="ky-ticks">
                    <option value="64"></option>
                    <option value="96"></option>
                    <option value="128"></option>
                    <option value="160"></option>
                    <option value="192"></option>
                    <option value="224"></option>
                    <option value="256"></option>
                    <option value="288"></option>
                    <option value="320"></option>
                </datalist>
            
            <div class="control-group">
                <label for="kz-slider">k<sub>z</sub> Matrix Size: <span id="kz-value">128</span></label>
                    <input type="range" id="kz-slider" min="64" max="320" value="128" step="32" class="slider" list="kz-ticks">
            </div>
                <datalist id="kz-ticks">
                    <option value="64"></option>
                    <option value="96"></option>
                    <option value="128"></option>
                    <option value="160"></option>
                    <option value="192"></option>
                    <option value="224"></option>
                    <option value="256"></option>
                    <option value="288"></option>
                    <option value="320"></option>
                </datalist>
            
            <div class="control-group">
                <label for="ky-accel-slider">k<sub>y</sub> Acceleration: <span id="ky-accel-value">1</span></label>
                    <input type="range" id="ky-accel-slider" min="1" max="4" value="1" step="1" class="slider" list="ky-accel-ticks">
            </div>
                <datalist id="ky-accel-ticks">
                    <option value="1"></option>
                    <option value="2"></option>
                    <option value="3"></option>
                    <option value="4"></option>
                </datalist>
            
            <div class="control-group">
                <label for="kz-accel-slider">k<sub>z</sub> Acceleration: <span id="kz-accel-value">1</span></label>
                    <input type="range" id="kz-accel-slider" min="1" max="4" value="1" step="1" class="slider" list="kz-accel-ticks">
            </div>
                <datalist id="kz-accel-ticks">
                    <option value="1"></option>
                    <option value="2"></option>
                    <option value="3"></option>
                    <option value="4"></option>
                </datalist>
            
            <div class="control-group" id="cal-size-control">
                <label for="cal-size-slider">Calibration Region: <span id="cal-size-value">32</span></label>
                    <input type="range" id="cal-size-slider" min="16" max="64" value="32" step="16" class="slider" disabled list="cal-size-ticks">
            </div>
                <datalist id="cal-size-ticks">
                    <option value="16"></option>
                    <option value="32"></option>
                    <option value="48"></option>
                    <option value="64"></option>
                </datalist>
            
            <div class="control-group">
                <label for="kz-pf-slider">k<sub>z</sub> Partial Fourier Factor: <span id="kz-pf-value">1.0</span></label>
                    <input type="range" id="kz-pf-slider" min="0.5" max="1.0" value="1.0" step="0.05" class="slider" list="kz-pf-ticks">
            </div>
                <datalist id="kz-pf-ticks">
                    <option value="0.5"></option>
                    <option value="0.55"></option>
                    <option value="0.6"></option>
                    <option value="0.65"></option>
                    <option value="0.7"></option>
                    <option value="0.75"></option>
                    <option value="0.8"></option>
                    <option value="0.85"></option>
                    <option value="0.9"></option>
                    <option value="0.95"></option>
                    <option value="1.0"></option>
                </datalist>

            <div class="control-group" id="caipi-control">
                <label>
                    <input type="checkbox" id="caipi-checkbox" checked disabled>
                    CAIPIRINHA
                </label>
            </div>
            
            <div class="control-group" id="coverage-control">
                <label for="coverage-select">Coverage:</label>
                <select id="coverage-select">
                    <option value="rectangular">Rectangular</option>
                    <option value="elliptical" selected>Elliptical</option>
                </select>
            </div>
        
            
            <h3>View ordering parameters</h3>
            <div class="control-group">
                <label for="ordering-select">Method:</label>
                <select id="ordering-select">
                    <option value="sequential">Sequential</option>
                    <option value="lcpo">LCPO</option>
                    <option value="cplo">CPLO</option>
                    <option value="chevron" selected>Chevron</option>
                    <option value="croc">CROC</option>
                </select>
            </div>
            
            <div class="control-group">
                <label for="etl-slider">ETL (Echo Train Length): <span id="etl-value">72</span></label>
                    <input type="range" id="etl-slider" min="8" max="256" value="72" step="8" class="slider" list="etl-ticks">
            </div>
                <datalist id="etl-ticks">
                    <option value="8"></option>
                    <option value="16"></option>
                    <option value="24"></option>
                    <option value="32"></option>
                    <option value="40"></option>
                    <option value="48"></option>
                    <option value="56"></option>
                    <option value="64"></option>
                    <option value="72"></option>
                    <option value="80"></option>
                    <option value="88"></option>
                    <option value="96"></option>
                    <option value="104"></option>
                    <option value="112"></option>
                    <option value="120"></option>
                    <option value="128"></option>
                    <option value="136"></option>
                    <option value="144"></option>
                    <option value="152"></option>
                    <option value="160"></option>
                    <option value="168"></option>
                    <option value="176"></option>
                    <option value="184"></option>
                    <option value="192"></option>
                    <option value="200"></option>
                    <option value="208"></option>
                    <option value="216"></option>
                    <option value="224"></option>
                    <option value="232"></option>
                    <option value="240"></option>
                    <option value="248"></option>
                    <option value="256"></option>
                </datalist>
            
            <div class="control-group" id="center-echo-control">
                <label for="center-echo-slider">Center Echo: <span id="center-echo-value">22</span></label>
                    <input type="range" id="center-echo-slider" min="1" max="256" value="22" class="slider" list="center-echo-ticks">
            </div>
                <datalist id="center-echo-ticks">
                    <option value="1"></option>
                    <option value="2"></option>
                    <option value="3"></option>
                    <option value="4"></option>
                    <option value="5"></option>
                    <option value="6"></option>
                    <option value="7"></option>
                    <option value="8"></option>
                    <option value="9"></option>
                    <option value="10"></option>
                    <option value="11"></option>
                    <option value="12"></option>
                    <option value="13"></option>
                    <option value="14"></option>
                    <option value="15"></option>
                    <option value="16"></option>
                    <option value="17"></option>
                    <option value="18"></option>
                    <option value="19"></option>
                    <option value="20"></option>
                    <option value="21"></option>
                    <option value="22"></option>
                    <option value="23"></option>
                    <option value="24"></option>
                    <option value="25"></option>
                    <option value="26"></option>
                    <option value="27"></option>
                    <option value="28"></option>
                    <option value="29"></option>
                    <option value="30"></option>
                    <option value="31"></option>
                    <option value="32"></option>
                    <option value="33"></option>
                    <option value="34"></option>
                    <option value="35"></option>
                    <option value="36"></option>
                    <option value="37"></option>
                    <option value="38"></option>
                    <option value="39"></option>
                    <option value="40"></option>
                    <option value="41"></option>
                    <option value="42"></option>
                    <option value="43"></option>
                    <option value="44"></option>
                    <option value="45"></option>
                    <option value="46"></option>
                    <option value="47"></option>
                    <option value="48"></option>
                    <option value="49"></option>
                    <option value="50"></option>
                    <option value="51"></option>
                    <option value="52"></option>
                    <option value="53"></option>
                    <option value="54"></option>
                    <option value="55"></option>
                    <option value="56"></option>
                    <option value="57"></option>
                    <option value="58"></option>
                    <option value="59"></option>
                    <option value="60"></option>
                    <option value="61"></option>
                    <option value="62"></option>
                    <option value="63"></option>
                    <option value="64"></option>
                    <option value="65"></option>
                    <option value="66"></option>
                    <option value="67"></option>
                    <option value="68"></option>
                    <option value="69"></option>
                    <option value="70"></option>
                    <option value="71"></option>
                    <option value="72"></option>
                    <option value="73"></option>
                    <option value="74"></option>
                    <option value="75"></option>
                    <option value="76"></option>
                    <option value="77"></option>
                    <option value="78"></option>
                    <option value="79"></option>
                    <option value="80"></option>
                    <option value="81"></option>
                    <option value="82"></option>
                    <option value="83"></option>
                    <option value="84"></option>
                    <option value="85"></option>
                    <option value="86"></option>
                    <option value="87"></option>
                    <option value="88"></option>
                    <option value="89"></option>
                    <option value="90"></option>
                    <option value="91"></option>
                    <option value="92"></option>
                    <option value="93"></option>
                    <option value="94"></option>
                    <option value="95"></option>
                    <option value="96"></option>
                </datalist>
            
            <div class="control-group" style="display: flex; gap: 20px; align-items: center;">
                <div id="mtf-control" style="display: inline-flex; align-items: center; gap: 8px;">
                    <label for="mtf-direction-select">MTF Direction:</label>
                    <select id="mtf-direction-select">
                        <option value="ky">k<sub>y</sub></option>
                        <option value="kz">k<sub>z</sub></option>
                    </select>
                </div>
                
                <div id="shot-order-control" style="display: none; align-items: center; gap: 8px;">
                    <label for="shot-order-select">Shot Order:</label>
                    <select id="shot-order-select">
                        <option value="ky">k<sub>y</sub></option>
                        <option value="kz">k<sub>z</sub></option>
                        <option value="azimuthal">Azimuthal</option>
                    </select>
                </div>
            </div>
        </div>
        
        <div class="plot-controls">
            <div class="control-group">
                <label>
                    <input type="checkbox" id="shot-highlight-checkbox" checked>
                    Highlight Shot: <span id="shot-select-value">1</span>
                </label>
                <input type="range" id="shot-select-slider" min="1" max="1" value="1" step="1" class="slider">
            </div>
            <div class="control-group">
                <label>
                    <input type="checkbox" id="echo-highlight-checkbox" checked>
                    Highlight Echo: <span id="echo-select-value">1</span>
                </label>
                <input type="range" id="echo-select-slider" min="1" max="1" value="1" step="1" class="slider">
            </div>
        </div>

        <div class="plots-container">
            <div class="plot-column">
                <canvas id="colorbar-shot" class="colorbar-canvas"></canvas>
                <div id="plot-by-shot" class="plot-wrapper"></div>
                <button id="export-shot-svg" class="export-button">Export Shot View as SVG</button>
            </div>
            <div class="plot-column">
                <canvas id="colorbar-echo" class="colorbar-canvas"></canvas>
                <div id="plot-by-echo" class="plot-wrapper"></div>
                <button id="export-echo-svg" class="export-button">Export Echo View as SVG</button>
            </div>
        </div>

        <div class="info-panel">
            <p>Total phase encodes: <span id="info-total">0</span></p>
            <p>Number of shots: <span id="info-acceleration">1</span></p>
        </div>
    </div>

    <script src="kspace-utils.js"></script>
    <script src="d3-plots.js"></script>
    <script src="app.js"></script>
</body>
</html>
